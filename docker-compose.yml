services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: crm_nestjs_app
    restart: unless-stopped
    command: sh -c "npm install && npm run start:dev"
    ports:
      - '${PORT:-8000}:3000'
    env_file:
      - .env
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DATABASE=${DB_DATABASE:-nestjs_crm}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - DB_ADMIN_PASSWORD_TEST=${DB_ADMIN_PASSWORD_TEST:-123456}
      - DB_SALES_PASSWORD_TEST=${DB_SALES_PASSWORD_TEST:-123456}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-access_secret_crm_2026_fc_vietnam}
      - ACCESS_TOKEN_EXPIRES_IN=${ACCESS_TOKEN_EXPIRES_IN:-1d}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-refresh_secret_crm_2026_fc_vietnam}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN:-7d}
      - IDEMPOTENCY_KEY=${IDEMPOTENCY_KEY:-crm_idempotency_key}
      - NODE_ENV=${NODE_ENV:-development}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://localhost:3000/api > /dev/null 2>&1 || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - crm_network

  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-nestjs_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-nestjs_crm}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - crm_network

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - crm_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: crm_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "echo srvr | nc -w 2 localhost 2181 | grep -q 'Zookeeper version'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - crm_network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: crm_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'kafka-topics --bootstrap-server localhost:29092 --list > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - crm_network

volumes:
  postgres_data:
    name: crm_postgres_data
  redis_data:
    name: crm_redis_data
  zookeeper_data:
    name: crm_zookeeper_data
  zookeeper_log:
    name: crm_zookeeper_log
  kafka_data:
    name: crm_kafka_data

networks:
  crm_network:
    name: crm_network
    driver: bridge

#docker compose logs -f app: Để xem log app
